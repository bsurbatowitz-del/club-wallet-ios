name: ClubWallet
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ClubCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClubWallet:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ClubCore
        product: ClubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Club Wallet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.clubwallet.transfer
            UTTypeDescription: Club Wallet transfer file
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [clubwallet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Club Wallet transfer file
            LSHandlerRank: Owner
            LSItemContentTypes: [com.clubwallet.transfer]
          - CFBundleTypeName: Spreadsheet
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.oasis-open.opendocument.spreadsheet, org.openxmlformats.spreadsheetml.sheet, public.comma-separated-values-text]
