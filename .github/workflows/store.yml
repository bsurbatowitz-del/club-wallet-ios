name: App Store listing (draft)

# Runs only when started by hand (Actions → App Store listing → Run workflow).
# Fills in texts, screenshots and TestFlight info in App Store Connect. Never submits for review.
on:
  workflow_dispatch:

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyjwt cryptography requests
      - run: python3 ci/asc_store.py
