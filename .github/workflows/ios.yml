name: iOS

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.clubwallet' }}
  TEAM_ID: ${{ vars.TEAM_ID || 'AAAAAAAAAA' }}

jobs:
  core-tests:
    name: Core tests (signing, files, Google, email)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Report
        if: always()
        run: ci/report.sh test.log "Core tests"
      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: core-test-log
          path: test.log

  build:
    name: Build iPhone app (no signing)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -project ClubWallet.xcodeproj -scheme ClubWallet \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report
        if: always()
        run: ci/report.sh build.log "App build"
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

  screenshots:
    name: Run in iPhone simulator (screenshots)
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build, launch and screenshot
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c = c or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcodebuild build -project ClubWallet.xcodeproj -scheme ClubWallet -destination "id=$UDID" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -20
          APP=$(ls -d dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demo "$@" > /dev/null
            sleep 9
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID"; then
              xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
            else
              echo "::warning title=Simulator::$name – app is not running (crashed?)"
            fi
          }
          shoot 1-members -tab 0
          shoot 2-member -tab 0 -screen member
          shoot 3-design -tab 1
          shoot 4-wallets -tab 2
          shoot 5-email -tab 3
          shoot 6-settings -tab 4
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          [ -n "$DATA" ] && cp "$DATA"/Documents/demo/*.png shots/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "ClubWallet"' --style compact 2>/dev/null \
            | grep -iE "fatal|crash|error" | head -20 > shots/log.txt || true
          sips -Z 1000 shots/*.png > /dev/null
          ls -la shots
          echo "::notice title=Screenshots::$(ls shots | tr '\n' ' ')"
      - name: Publish screenshots to branch ci-screenshots
        run: |
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots

  testflight:
    name: Upload to TestFlight
    needs: [core-tests, build]
    if: ${{ vars.TESTFLIGHT == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Check setup
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ "$TEAM_ID" != "AAAAAAAAAA" ] || missing="$missing TEAM_ID(variable)"
          [ "$BUNDLE_ID" != "com.example.clubwallet" ] || missing="$missing BUNDLE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets/variables:$missing (see README)"; exit 1; fi
      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (unsigned – signing happens at export)
        run: |
          set -o pipefail
          xcodebuild archive -project ClubWallet.xcodeproj -scheme ClubWallet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ClubWallet.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log | tail -40
      - name: Sign and upload to TestFlight
        run: |
          set -o pipefail
          cp ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ClubWallet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -60
      - name: Report
        if: always()
        run: |
          ci/report.sh archive.log "Archive"
          ci/report.sh export.log "TestFlight upload"
      - name: Done
        run: echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."
